name: oxpicious-trading-cluster

services:
  db:
    image: supabase/postgres:17.6.1.150_amd64
    container_name: oxpicious-db
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "9876:5432"
    volumes:
      # Primary data lives on E: disk as a bind mount (like the replica), so a
      # Docker Desktop / WSL vhdx failure can never take the DB data with it.
      # The old named volume db_data is retained below as a cold fallback copy.
      - E:/docker-data/oxpicious-db-primary:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ./sql:/docker-entrypoint-sql.d
      # This image runs postgres with -D-style config in /etc/postgresql, so
      # $PGDATA/pg_hba.conf is IGNORED. Mount the repo copy (with the db-replica
      # streaming rule) over it: a container recreated from the image otherwise
      # loses the rule and the replica can no longer connect.
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase_network

  db-replica:
    image: supabase/postgres:17.6.1.150_amd64
    container_name: oxpicious-db-replica
    restart: unless-stopped
    shm_size: 256m
    entrypoint: ["/replica-entrypoint.sh"]
    command: []
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9877:5432"
    volumes:
      # Data lives on E: disk
      - E:/docker-data/oxpicious-db-replica:/var/lib/postgresql/data
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    environment:
      POSTGRES_PASSWORD: postgres
      PRIMARY_HOST: db
      PRIMARY_PORT: "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - supabase_network

  # The dockerized Python sandbox for LLM-generated code (llm_agents/sandbox/).
  # Runs the sagacient/cutepandas py3.12 data-science image with the
  # stdlib-only runner API (llm_agents/sandbox/runner.py) — the execution
  # target the llm_agents.sandbox MCP middleware delegates files to.
  # restart + HEALTHCHECK keep it live as always; the port is published on
  # host loopback ONLY (no auth — same trust model as the repo's other
  # localhost daemons). Session files live in the repo-root
  # oxpicious-py-sandbox/ dir (gitignored) so they survive container
  # rebuilds.
  py-sandbox:
    build:
      context: ../llm_agents/sandbox
    container_name: oxpicious-py-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ../oxpicious-py-sandbox:/home/pandas/sandbox
    environment:
      PY_SANDBOX_ROOT: /home/pandas/sandbox
      # Read-only DB access for sandbox scripts: libpq env presets every
      # plain psycopg.connect() to the readonly_analytics role (SELECT-only
      # at the DATABASE level, database/sql/00_readonly_role.sql) over the
      # compose network — same contract the old local sandbox had, now
      # pointing at the db service instead of the host port.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${SUPABASE_DB:-oxpicious-stats}
      PGUSER: readonly_analytics
      PGPASSWORD: ${READONLY_ANALYTICS_PASSWORD:-read0n!y}
    networks:
      - supabase_network

# Kept as a cold fallback snapshot of the primary data as of 2026-09-23
# (pre-migration). Safe to remove once the E: bind-mount primary has proven
# itself stable for a while.
volumes:
  db_data:

networks:
  supabase_network:
    driver: bridge
